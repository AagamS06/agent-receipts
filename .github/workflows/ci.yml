name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check src tests
      - run: mypy --strict src
      - run: pytest
      - name: Committed JSON Schema is up to date
        run: agent-receipts schema --check schema/receipt.v1.json
      - name: Smoke test the CLI on the examples
        run: |
          agent-receipts --version
          agent-receipts render examples/codex-rollout.jsonl -f json -o r.json || test $? -eq 1
          python -c "import json; assert json.load(open('r.json'))['verdict']['status'] == 'FAILED'"
          python -c "import json, jsonschema; jsonschema.validate(json.load(open('r.json')), json.load(open('schema/receipt.v1.json')))"
