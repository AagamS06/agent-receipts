[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "agent-receipts"
version = "0.2.0"
description = "Turn Claude Code / Codex session logs into reviewable receipts for agent-authored PRs, posted as a sticky PR comment."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Aagam Shah" }]
keywords = ["ai-agents", "code-review", "claude-code", "codex", "developer-tools"]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "rich>=13.7",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "jsonschema>=4.18"]

[project.scripts]
agent-receipts = "agent_receipts.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_receipts"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108", "E501"]
"src/agent_receipts/cli.py" = ["B008"]                # Typer's documented default-argument style
"src/agent_receipts/risk/__init__.py" = ["E501"]      # one rule per line reads better than wrapped regexes
"src/agent_receipts/render/__init__.py" = ["E501"]    # Markdown template

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
